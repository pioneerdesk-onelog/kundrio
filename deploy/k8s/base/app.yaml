apiVersion: apps/v1
kind: Deployment
metadata:
  name: kundrio-app
  labels: { app.kubernetes.io/name: kundrio-app }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: kundrio-app }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kundrio-app }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: kundrio-app }
      containers:
        - name: app
          image: kundrio
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: kundrio-config }
            - secretRef: { name: kundrio-secrets }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/standalone/.next/cache }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: next-cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: kundrio-app
spec:
  selector: { app.kubernetes.io/name: kundrio-app }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kundrio-app
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kundrio-app }
