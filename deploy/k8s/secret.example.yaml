# VORLAGE – nicht mit echten Werten committen. Besser direkt anlegen:
#   kubectl -n kundrio create secret generic kundrio-secrets --from-env-file=secrets.env
apiVersion: v1
kind: Secret
metadata:
  name: kundrio-secrets
  namespace: kundrio
type: Opaque
stringData:
  DATABASE_URL: postgresql://crm:<passwort>@<flex-host>:5432/crm?sslmode=require
  APP_SECRET: <openssl rand -hex 32>
  MAIL_EVENTS_SECRET: <openssl rand -hex 24>
  SMTP_HOST: ""
  SMTP_USER: ""
  SMTP_PASS: ""
  OLLAMA_BASE_URL: ""
  YOUTUBE_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: kundrio-backup-secrets
  namespace: kundrio
type: Opaque
stringData:
  DATABASE_URL: postgresql://crm:<passwort>@<flex-host>:5432/crm?sslmode=require
  BACKUP_AGE_RECIPIENT: age1...
  S3_ENDPOINT: https://object.storage.eu01.onstackit.cloud
  S3_BUCKET: kundrio-backups
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
---
# ClusterIssuer für Let's Encrypt (einmal je Cluster)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef: { name: letsencrypt-account }
    solvers:
      - http01: { ingress: { ingressClassName: nginx } }
