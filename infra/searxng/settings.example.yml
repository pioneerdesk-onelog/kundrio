# Vorlage – kopieren nach settings.yml und secret_key setzen (openssl rand -hex 32)
use_default_settings: true
server:
  secret_key: "BITTE-ERSETZEN"
  limiter: false
  image_proxy: false
  public_instance: false
search:
  safe_search: 1
  default_lang: "de"
  formats: [html, json]
ui:
  default_locale: "de"
outgoing:
  request_timeout: 6.0
